<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="材料価格">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>材料価格管理</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="appHeader">
  <div>
    <h1>材料価格</h1>
    <p>検索・撮影・入力・一覧</p>
  </div>
  <button id="restoreBtn" class="ghostBtn">データ復元</button>
</header>

<nav class="tabs">
  <button class="tab active" data-panel="searchPanel">検索</button>
  <button class="tab" data-panel="cameraPanel">撮影</button>
  <button class="tab" data-panel="inputPanel">入力</button>
  <button class="tab" data-panel="listPanel">一覧</button>
</nav>

<main>
<section id="searchPanel" class="panel active">
  <input id="search" class="searchInput" placeholder="MDF / ラワン / 30x4x8 / 15mm">
  <div class="chips">
    <button class="chip active" data-q="">全件</button>
    <button class="chip" data-q="MDF">MDF</button>
    <button class="chip" data-q="ラワン">ラワン</button>
    <button class="chip" data-q="ベニヤ">ベニヤ</button>
    <button class="chip" data-q="フブル">フブル</button>
    <button class="chip" data-q="パイン">パイン</button>
    <button class="chip" data-q="ジナ">ジナ</button>
  </div>

  <div class="summary">
    <div><strong id="count">0</strong><span>件</span></div>
    <div><strong id="avg">0</strong><span>平均</span></div>
    <div><strong id="min">0</strong><span>最安</span></div>
    <div><strong id="max">0</strong><span>最高</span></div>
  </div>

  <div class="card">
    <div class="headLine">
      <h2>価格推移</h2>
      <span id="chartCount" class="pill">0件</span>
    </div>
    <label class="label">比較方法
      <select id="graphMode">
        <option value="exact">同一商品だけ</option>
        <option value="thickness">厚み別</option>
        <option value="sqm">㎡単価</option>
        <option value="m3">m³単価</option>
      </select>
    </label>
    <p id="graphHint" class="hint"></p>
    <div class="chartBox">
      <canvas id="chart" width="900" height="320"></canvas>
    </div>
    <div id="barChart" class="barChart"></div>
  </div>

  <div class="card">
    <h2>検索結果</h2>
    <div id="cards" class="cards"></div>
  </div>
</section>

<section id="cameraPanel" class="panel">
  <div class="card">
    <h2>カメラ入力</h2>
    <p class="hint">撮影→OCR→確認→登録。OCR結果は必ず確認してください。</p>
    <input id="imageInput" type="file" accept="image/*" capture="environment" hidden>
    <div class="buttonGrid">
      <button id="cameraBtn" class="mainBtn">📷 撮影</button>
      <button id="imageBtn" class="subBtn">画像選択</button>
      <button id="ocrBtn" class="subBtn">OCR</button>
    </div>
    <img id="preview" class="preview">
    <div id="ocrStatus" class="status">未読込</div>
    <textarea id="ocrText" placeholder="OCR結果がここに入ります。"></textarea>
    <div class="buttonGrid">
      <button id="parseBtn" class="mainBtn">明細化</button>
      <button id="addParsedBtn" class="subBtn">一括登録</button>
    </div>
  </div>
  <div class="card">
    <h2>抽出確認</h2>
    <div id="parsedCards" class="cards"></div>
  </div>
</section>

<section id="inputPanel" class="panel">
  <div class="card">
    <h2>手入力</h2>
    <div class="form">
      <label>日付<input id="date" inputmode="numeric" placeholder="2026-06-07"></label>
      <label>商品名<input id="name" placeholder="MDF 30x4x8"></label>
      <div class="two">
        <label>数量<input id="qty" type="number" step="0.01" value="1"></label>
        <label>単価<input id="unitPrice" type="number" step="1"></label>
      </div>
      <div class="two">
        <label>金額<input id="amount" type="number" step="1"></label>
        <label>仕入先<input id="supplier" placeholder="ソゴウ"></label>
      </div>
    </div>
    <button id="addBtn" class="wideBtn">追加する</button>
    <button id="clearBtn" class="dangerBtn">全削除</button>
  </div>
</section>

<section id="listPanel" class="panel">
  <div class="card">
    <h2>登録済み一覧</h2>
    <div class="buttonGrid twoButtons">
      <button id="exportBtn" class="subBtn">CSV書き出し</button>
      <label class="fileBtn">CSV読み込み<input id="csvInput" type="file" accept=".csv" hidden></label>
    </div>
    <div id="listCards" class="cards"></div>
  </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./seed.js"></script>
<script src="./app.js"></script>
</body>
</html>
