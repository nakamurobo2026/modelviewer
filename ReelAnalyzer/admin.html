
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Admin</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f1115;color:#f5f7fa;margin:0;padding:0}
header{padding:20px;background:#171b22;border-bottom:1px solid #2a313d}
main{max-width:1200px;margin:auto;padding:20px}
.card{background:#171b22;border:1px solid #2a313d;border-radius:16px;padding:16px;margin-bottom:16px}
textarea,input,select{width:100%;background:#0d1015;color:#fff;border:1px solid #2a313d;border-radius:10px;padding:10px;margin-top:8px}
button{background:#6ee7b7;color:#07130f;border:none;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;margin:4px}
.output{white-space:pre-wrap;background:#0d1015;border:1px solid #2a313d;border-radius:12px;padding:14px;min-height:120px}
.small{opacity:.7;font-size:12px}
</style>
</head>
<body>
<header><h1>Admin</h1></header>
<main>
<div class="card">
<h2>参考構造DB</h2>
<label>参考ファイル読み込み</label>
<input id="refFileInput" type="file" accept=".txt,.md,.csv,.json">
<div class="small">txt / md / csv / json 対応</div>

<label>資料・メモ</label>
<textarea id="refMaterial" style="min-height:260px"></textarea>

<button onclick="saveRef()">保存</button>
</div>

<div class="card">
<h2>投稿DB</h2>
<input id="postTitle" placeholder="タイトル">
<input id="postViews" placeholder="再生数">
<textarea id="postMemo" placeholder="投稿カルテ"></textarea>
<button onclick="savePost()">保存</button>
</div>

<script>
function saveRef(){
 const data=localStorage.getItem('refs')||'[]';
 const arr=JSON.parse(data);
 arr.push({text:document.getElementById('refMaterial').value,date:Date.now()});
 localStorage.setItem('refs',JSON.stringify(arr));
 alert('保存しました');
}
function savePost(){
 const data=localStorage.getItem('posts')||'[]';
 const arr=JSON.parse(data);
 arr.push({
  title:document.getElementById('postTitle').value,
  views:document.getElementById('postViews').value,
  memo:document.getElementById('postMemo').value,
  date:Date.now()
 });
 localStorage.setItem('posts',JSON.stringify(arr));
 alert('保存しました');
}
document.getElementById('refFileInput').addEventListener('change',e=>{
 const f=e.target.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
   document.getElementById('refMaterial').value += "\n\n--- "+f.name+" ---\n"+r.result;
 };
 r.readAsText(f,'utf-8');
});
</script>
</main>
</body>
</html>
